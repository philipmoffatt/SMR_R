objective: Verify actual integrated JAX state evolution over two and thirty days against independently captured CPU daily fields, reporting and terminal rasters with only shortwave replay as prescribed input.
implementation_constraints:
  - Preserve legacy science, defaults, fixed six-hour steps and selected snow mode as a distinct behavior.
  - Correct only demonstrated integrated parity defects; do not inject reference states or masks into model evolution.
  - Never change original frozen artifacts or Perl source; any instrumentation is confined to a temporary copy and adds capture only.
  - Run GRASS capture in a disposable location. Store large generated references outside Git at a new explicitly named output directory, with versioned capture tooling and checksum evidence.
  - Distinguish original legacy report formatting from the optimized CPU reporting profile; do not fit numerical tolerances to failed fields.
acceptance_criteria:
  - Whole-engine two-day history agrees with every existing captured daily field on all required cells.
  - A thirty-day reference extension is independently anchored to original two-day maps and frozen terminal rasters before acceptance.
  - Default pure-JAX thirty-day named daily fluxes, states, basin history and terminal fields pass explicit strict checks on required support; optional native CPU FFI success is diagnostic and cannot close this criterion.
  - Missing days/fields, changed support, nonfinite values and disagreements cause a nonzero verification CLI exit.
  - Existing surface, soil, routing, selected snow-policy and plant interface tests pass.
validation:
