objective: Establish strict CPU verification of receiver-weighted lateral routing, slope defaults and basin recurrence using source expressions, independent GRASS capture, synthetic boundaries and frozen evidence.
implementation_constraints:
  - Preserve legacy receiver weights, slope degrees, six-hour rates, reporting-coupled recurrence and asymmetric units; do not replace them with new physics.
  - Use only temporary disposable GRASS locations for reference capture; never edit existing runtimes.
  - Correct only demonstrated parity defects within scope, including static precision effects required to establish routing parity.
  - No reference-output injection into actual model state, tolerance fitting, dropped required support or altered original frozen artifacts.
  - Source-only checks and captured GRASS evidence must be distinguished; multi-watershed and final-only reporting limitations must be stated.
acceptance_criteria:
  - Eight orientations, receiving weights, NULL/border behavior, zero flowunits, layer/total updates and domain gain/loss accounting agree with independent evidence.
  - Slope values and their downstream flow effects match GRASS defaults on required frozen support.
  - Reservoir initialization, percolation/runoff conversions and previous-baseflow update order match source and captured output.
  - Missing, nonfinite, malformed and mismatching evidence causes nonzero CLI exit.
  - Existing soil, surface, snow policy and plant checks pass.
validation:
  - python -m unittest discover -s tests -p test_jax_*.py -q
  - python -m smr_jax.verify_routing
  - preflight.ps1 PKT-SMR-JAX-VERIFY-03
  - scope.ps1 PKT-SMR-JAX-VERIFY-03
completion_outputs:
