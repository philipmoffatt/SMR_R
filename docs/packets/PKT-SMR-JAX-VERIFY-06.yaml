objective: Verify the identical float64 JAX functions on WSL CPU and CUDA GPU, then benchmark compilation, transfers, synchronized execution and prepared-input end-to-end workflow without changing model physics or existing deferral decisions.
implementation_constraints:
  - Reuse the existing WSL smr-jax environment without dependency or host-system changes; preserve the older Linux checkout and uncommitted work.
  - Canonical edits stay in this packet worktree. Linux-home execution uses a new exact-commit source snapshot with file hashes and a copied prepared radiation cache, not edits to an existing checkout.
  - Require a real CUDA device and float64 arrays; no silent CPU fallback, native math FFI, Python callback or float32 model variant.
  - Use the existing strict unit-specific comparison budgets and report every failure; do not fit cross-device tolerances to observed mismatches.
  - Preserve exact masks and counters and report snow-presence disagreements; pre-existing strict Windows legacy parity remains deferred, not passed.
  - Benchmark the same complete run_days output contract on both devices, synchronize timing and separate data loading, transfer, lowering/compilation, first execution, warmed execution and output download.
  - Run the two-day case and record GPU peak memory before attempting thirty days. Only parity-qualified timings may be presented as a validated GPU speedup.
acceptance_criteria:
  - NVIDIA CUDA float64 smoke and foundation tests run on the actual RTX device.
  - Synthetic dry/wet, snow/melt/refreeze, land-cover, zero-flow and boundary cases compare complete CPU/GPU outputs under predeclared unit budgets.
  - External plant-water kernels pass independent layer/cell/domain water-ledger checks on both devices.
  - Two-day then thirty-day prepared-radiation histories and actual terminal state compare on all required cells; failures remain explicit and cause a nonzero verification exit.
  - Timings identify hardware, JAX/library versions, source and data hashes, GPU memory and measurement boundaries.
