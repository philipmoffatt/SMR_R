objective: Record operator-authorized deferral of tiny strict VERIFY-04 differences and implement and verify a reusable radiation decomposition that responds to evolving JAX snow albedo without prescribing completed q.srad maps.
implementation_constraints:
  - Keep the pure-JAX model default and replay provider available; no native FFI or Python callback is required by the new provider.
  - Use GRASS only to prepare terrain/date/weather components outside model evolution; preserve scientific r.sun and legacy cloud conventions.
  - Keep references and original Perl unchanged; captures use new disposable GRASS projects and new output directories outside Git.
  - Derive radiation error bounds from source FCELL precision before comparison; never fit thresholds to failed observations.
  - Keep strict VERIFY-04 failures visible and deferred, not passed, under the operator's explicit instruction to move on.
acceptance_criteria:
  - New shortwave uses the actual evolving model albedo inside the JAX scan, with explicit incident and reflected components and source units.
  - GRASS comparisons cover changing albedo, date and sky conditions; missing support, forcing mismatch and corrupt preparation artifacts fail.
  - End-to-end two-day and thirty-day runs use no completed shortwave replay and report state and flux differences honestly against the captured reference.
  - JIT and synthetic snow/albedo feedback and existing JAX regressions pass.
validation:
